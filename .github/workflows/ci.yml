# 每次推送或提 PR：装依赖、跑测试、构建产物。
# 目的很简单——代码合并进来之前，保证它是测过、能构建的。

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14        # 和 package.json 的 engines 对齐
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
