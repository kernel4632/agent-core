# 推一个 vX.Y.Z 的标签时自动发版：跑测试、构建、打包、建 GitHub Release，并发布到 npm。
# 发布包里的版本号和标签对不上就直接失败，避免发错版本。
#
# 本地等价的做法是 `bun run release`：它负责升版本号、提交、打标签、推标签，发布仍由这里完成。
# 走的是 GitHub 自己的权限，不需要你在电脑上登录 gh。
#
# 发 npm 走 Trusted Publishing（OIDC）：用 GitHub 的短期身份令牌换发布权限，
# 不需要任何 npm token，也不需要验证码。前提是在 npmjs.com 的包设置里把
# 本仓库（kernel4632/agent-core）和本文件名（release.yml）配成可信发布者。

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write        # 建 Release、传附件需要
  id-token: write        # Trusted Publishing（OIDC）需要：让工作流能签出身份令牌

# 同一个标签只跑一个：偶尔的重复触发会排队而不是各建一次 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # 取全历史：发布说明要按"上一个标签..本标签"列出这次的提交
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test

      # 打包前先核对：package.json 的版本必须等于标签去掉 v 之后的部分。
      - name: 核对版本号和标签一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun -e "console.log(require('./package.json').version)")"
          echo "标签=$tag 包=$pkg"
          [ "$tag" = "$pkg" ] || { echo "版本号对不上，先跑 bun run bump 再打标签"; exit 1; }

      # bun pm pack 会先触发 prepack（构建 + 产物自检），自检不过不会产出。
      - run: bun pm pack --filename agent-core.tgz
      - run: bun pm pack

      # 建 Release；万一这个标签已经建过（重复触发），改成补传附件，不报错。
      # 幂等是这个任务该有的性质：同样一个标签跑几次，结果都一样。
      # 发布说明按"上一个标签..本标签"的提交自动生成，每个版本写自己的更新，不再是一段固定介绍。
      - name: 建 Release（已存在就补传附件）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(agent-core.tgz "kernel4632-agent-core-${GITHUB_REF_NAME#v}.tgz")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            prev="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
            if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; else range="$GITHUB_REF_NAME"; fi
            notes="$(git log --no-merges --pretty=format:'- %s' "$range")"   # 本次从上一个标签到现在的提交，就是这一版的更新说明。
            [ -n "$notes" ] || notes="发布 $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "$GITHUB_REF_NAME" \
              --notes "$notes"
          fi

      # --- 发布到 npm（Trusted Publishing，免 token / 验证码）---
      # 放在建 Release 之后：即使 npm 这步因为还没配可信发布者而失败，GitHub Release 也已经建好了。
      # npm publish 会自动触发 prepack（bun run build）和 prepublishOnly（bun test），所以这里不用再重复。
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # 发布构建不使用缓存
      - name: 发布到 npm（这个版本已经在 npm 上就跳过）
        run: |
          name="$(bun -e "console.log(require('./package.json').name)")"
          ver="$(bun -e "console.log(require('./package.json').version)")"
          if npm view "$name@$ver" version >/dev/null 2>&1; then
            echo "$name@$ver 已经在 npm 上，跳过发布"
          else
            npm publish --access public
          fi
